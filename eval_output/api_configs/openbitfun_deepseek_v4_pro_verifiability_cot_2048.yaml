schema_version: 1

# 2048-token CoT run stored under the shared API result root; the model slug
# deepseek_v4_pro_cot2048 keeps it distinct from the 512-token baseline.
output_path: eval_output/api_results
local_results_path: eval_output/results

api_base_url: https://api.openbitfun.com/v1
api_key_env: OPENBITFUN_API_KEY
env_file: .env
timeout_seconds: 180
max_retries: 5
progress_every: 10
require_response_model_match: true

temperature: 0
top_p: 1.0
max_tokens: 2048
max_tokens_by_mode:
  cot: 2048
extra_body:
  thinking:
    type: enabled

models:
  - name: deepseek-v4-pro
    slug: deepseek_v4_pro_cot2048

tasks:
  - name: rev_util_verifiability
    datasets:
      cot: data/rev_util_verifiability/cot/test_cot.jsonl
