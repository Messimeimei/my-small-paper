experiment_name: rev_util_helpfulness#qwen3_0.6b#label_only
model_name_or_path: model/Qwen3-0.6B
dataset_path: data/rev_util_helpfulness/label_only/train_label_only.jsonl
split_path: data/rev_util_helpfulness/label_only/splits/train_label_only_seed20260720.json
output_root: checkpoints/training-0.6B/rev_util_helpfulness/label_only

split_seed: 20260720
validation_ratio: 0.10

lora:
  target_modules: all-linear
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none

training:
  max_length: 8192
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  max_grad_norm: 0.3
  bf16: true
  gradient_checkpointing: true
  attn_implementation: sdpa
  logging_steps: 10
  save_total_limit: 1
  report_to: tensorboard

generation:
  batch_size: 16
  max_new_tokens: 32
